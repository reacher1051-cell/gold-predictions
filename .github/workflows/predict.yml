name: Auto Prediction Watcher

# Har 6 ghante khud chalega + Actions tab se hath se bhi chal sakta hai
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Repo lo
        uses: actions/checkout@v4

      - name: Python lagao
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Libraries lagao
        run: pip install -r requirements.txt

      - name: Instagram dekho aur prediction nikalo
        env:
          IG_SESSIONID: ${{ secrets.IG_SESSIONID }}
          IG_USERNAME: ${{ secrets.IG_USERNAME }}
          IG_PASSWORD: ${{ secrets.IG_PASSWORD }}
        run: python watch_predictions.py

      - name: Agar predictions badli to save (commit) kar do
        run: |
          git config user.name "prediction-bot"
          git config user.email "bot@users.noreply.github.com"
          git add predictions.json seen.json
          if git diff --cached --quiet; then
            echo "Koi tabdeeli nahi"
          else
            git commit -m "Auto: nayi prediction update"
            git push
          fi
